version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: delifast
      POSTGRES_PASSWORD: delifast_dev_password
      POSTGRES_DB: delifast
    ports:
      - '5432:5432'
    volumes:
      - delifast_pgdata:/var/lib/postgresql/data

volumes:
  delifast_pgdata:
